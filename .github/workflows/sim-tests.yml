name: sim tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Ideal robot: every scenario must pass. Exits non-zero on any FAIL.
      - run: python3 test_scenarios.py
